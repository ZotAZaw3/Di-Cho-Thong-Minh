# Trên VPS: chỉ chạy service api (DB, Auth, ảnh nằm trên Supabase).
# Nginx (cài trên máy host) proxy /it4788/ → 127.0.0.1:3000.
#
# Chạy local không cần Supabase: docker compose --profile local up -d --build
#   (thêm service db Postgres; đặt DATABASE_URL=postgresql://postgres:postgres@db:5432/dicho trong .env)
services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    profiles: [local]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dicho
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  uploads:
  pgdata:
